<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Quetta Countdown Home</title><style>
*{box-sizing:border-box}
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--text:#222b3b;--muted:#778195;--line:#e5eaf2;--accent:#456bd8;--accent-soft:#edf2ff;--hero-a:#edf3ff;--hero-b:#e6edff;--shadow:0 8px 26px #263e650a}
@media(prefers-color-scheme:dark){:root{--bg:#10141d;--panel:#191f2b;--text:#edf1f8;--muted:#a0aabc;--line:#2a3342;--accent:#a9c0ff;--accent-soft:#202b42;--hero-a:#202e4a;--hero-b:#1a2438;--shadow:0 8px 26px #0002}}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-size:14px}.page{max-width:1050px;margin:0 auto;padding:24px 28px 18px}.topbar{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.02em}.brand-mark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:white;font-weight:900;font-size:18px}.top-actions{display:flex;align-items:center;gap:18px}.date-label{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}.settings-link{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--text);background:var(--panel);font-size:18px}.welcome{display:none}.greeting{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}.welcome h1{font-size:clamp(29px,5vw,42px);letter-spacing:-.055em;margin:8px 0 8px;font-weight:800}.welcome p{margin:0;color:var(--muted);font-size:14px}.countdown{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px 28px;background:linear-gradient(120deg,var(--hero-a),var(--hero-b));border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-height:150px}.section-tag{font-size:10px;font-weight:850;letter-spacing:.14em;color:var(--accent);display:flex;align-items:center;gap:8px}.pulse{width:7px;height:7px;background:#4bbd91;border-radius:50%;box-shadow:0 0 0 4px #4bbd9120}.event-name{font-size:clamp(19px,3vw,25px);font-weight:800;letter-spacing:-.035em;margin:10px 0 4px;overflow-wrap:anywhere}.event-meta{color:var(--muted);font-size:12px}.countdown-right{text-align:right;min-width:120px}.countdown.urgent{animation:urgentPulse 1.4s ease-in-out infinite;border-color:#e59a37}.countdown.urgent .days-number{color:#e58a20}.countdown.last-day{background:linear-gradient(120deg,#fff1d8,#ffe5dc);color:#512b12}.countdown.last-day .event-meta,.countdown.last-day .days-label{color:#875b35}.countdown.last-day .days-number{color:#d44c22}.expiry-tag{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:6px;background:#ffdf9e;color:#6e3b00;font-size:10px;font-weight:900;letter-spacing:.08em}.expiry-tag[hidden]{display:none}@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 #e59a3720}50%{box-shadow:0 0 0 5px #e59a3735}}.days-number{font-size:clamp(38px,6vw,54px);font-weight:900;line-height:1;letter-spacing:-.06em;color:var(--accent)}.days-label{font-size:10px;letter-spacing:.14em;font-weight:850;color:var(--muted);margin-top:8px}.shortcuts-section{margin-top:34px}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.section-head h2{font-size:16px;letter-spacing:-.02em;margin:0}.section-head span{color:var(--muted);font-size:11px}.shortcuts{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}.shortcut{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;color:var(--text);font-size:11px;font-weight:650;padding:14px 4px;border:1px solid transparent;border-radius:16px;transition:background .15s,border-color .15s}.shortcut:hover,.shortcut:focus-visible{background:var(--panel);border-color:var(--line);outline:none}.shortcut-icon{width:62px;height:62px;display:grid;place-items:center;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:20px;font-weight:850;box-shadow:var(--shadow)}.shortcut-icon svg{width:37px;height:37px;display:block}.google{color:#4285f4}.youtube{color:#e62117}.gmail{color:#d84b3f}.wiki{font-family:Georgia,serif}.drive{color:#22a06b}.calendar{color:#4285f4;font-size:15px}.ssc{color:var(--accent)}.india{font-size:13px;color:#e68b35}.bottom-row{display:none}.manage-row{display:flex;justify-content:center;margin-top:24px}.manage-link{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--muted);font-size:12px;border:1px solid var(--line);background:var(--panel);padding:10px 14px;border-radius:12px}.manage-svg{width:17px;height:17px}.manage-svg svg{width:100%;height:100%}.manage-arrow{color:var(--accent);font-size:16px}.all-events-section{margin-top:26px}.all-events-section[hidden]{display:none}.event-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.event-tile{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--panel);min-width:0}.event-type-icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:13px;background:var(--accent-soft);color:var(--accent)}.event-type-icon svg{width:25px;height:25px}.event-tile-main{flex:1;min-width:0}.event-tile-name{font-size:13px;font-weight:800;overflow-wrap:anywhere}.event-tile-date{font-size:11px;color:var(--muted);margin-top:3px}.event-tile-count{text-align:right;min-width:68px}.event-tile-count strong{display:block;font-size:20px;letter-spacing:-.04em}.event-tile-count small{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.08em}.event-tile-count .green{color:#24966b}.event-tile-count .blue{color:#4778d5}.event-tile-count .orange{color:#d97706}.event-tile-count .red{color:#d13e3e}.event-tile.expiring{border-color:#e5a13e;animation:urgentPulse 1.4s ease-in-out infinite}.event-tile.expiring .event-tile-count strong{color:#d97706}.event-tile .expiry-mini{display:inline-block;background:#ffdf9e;color:#6e3b00;border-radius:5px;padding:2px 5px;font-size:8px;font-weight:900;margin-top:5px}.quote-card,.manage-card{display:flex;align-items:center;gap:13px;padding:17px;border:1px solid var(--line);border-radius:15px;background:var(--panel);text-decoration:none;color:var(--text);min-width:0}.quote-icon,.manage-icon{flex:0 0 38px;width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:19px}.quote-title{font-weight:750;font-size:13px}.quote-card p{margin:3px 0 0;color:var(--muted);font-size:11px}.manage-card>span:nth-child(2){display:grid;gap:3px;min-width:0}.manage-card strong{font-size:12px}.manage-card small{font-size:11px;color:var(--muted)}.arrow{margin-left:auto;color:var(--muted)}footer{display:none}
@media(max-width:720px){.page{padding:18px 14px}.welcome{padding:50px 0 26px}.shortcuts{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.shortcut-icon{width:66px;height:66px}.shortcut-icon svg{width:40px;height:40px}.event-cards{grid-template-columns:1fr}.shortcut{padding:12px 3px}.bottom-row{grid-template-columns:1fr}.countdown{padding:20px}.top-actions{gap:10px}.date-label{font-size:10px}}
@media(max-width:390px){.countdown{align-items:flex-start;flex-direction:column}.countdown-right{display:flex;align-items:baseline;gap:8px;text-align:left}.days-number{font-size:38px}.days-label{margin:0}.welcome h1{font-size:29px}}

/* v2.2 polish: greeting header, compact countdown stack, staggered entrance */
.topbar{min-height:40px}
.brand{min-height:32px}
.brand .greeting{display:block;font-size:clamp(18px,3vw,22px);letter-spacing:-.035em;text-transform:none;color:var(--text);font-weight:750}
.event-cards{gap:9px}
.event-tile{padding:11px 13px;gap:10px;border-radius:13px;animation:stackEnter .48s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--item-index,0) * 65ms)}
.event-type-icon{width:36px;height:36px;flex-basis:36px;border-radius:11px}
.event-type-icon svg{width:22px;height:22px}
.event-tile-name{font-size:12px}
.event-tile-date{font-size:10px;margin-top:2px}
.event-tile-count{min-width:60px}
.event-tile-count strong{font-size:18px}
.event-tile-count small{font-size:8px}
.event-tile .expiry-mini{font-size:8px;padding:2px 5px;margin-top:3px}
@keyframes stackEnter{from{opacity:0;transform:translateY(13px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.event-tile,.countdown.urgent{animation:none!important;transition:none!important}}

/* v2.3 spacing */
.topbar{margin-bottom:0}.countdown{margin-top:34px}@media(max-width:720px){.countdown{margin-top:38px}}

/* v2.7 layout and typography refinement */
:root{font-size:14px}
body{font-size:14px;line-height:1.45}
.topbar{min-height:32px}
.date-label{font-size:12px}
.countdown{min-height:0;padding:18px 22px;align-items:center;gap:16px}
.countdown-left{min-width:0;flex:1}
.countdown-right{flex:0 0 auto;min-width:86px}
.event-name{font-size:clamp(19px,3vw,24px);line-height:1.25;margin:7px 0 3px}
.event-meta{font-size:12px;line-height:1.4}
.expiry-tag{margin-top:7px;padding:3px 7px;font-size:10px}
.days-number{font-size:clamp(36px,5.5vw,50px)}
.days-label{font-size:10px;margin-top:6px}
.all-events-section{margin-top:24px}
.upcoming-head{align-items:center;gap:10px}
.upcoming-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.upcoming-actions #eventTotal{white-space:nowrap}
.manage-link-inline{font-size:11px;padding:7px 9px;gap:6px;white-space:nowrap}
.manage-link-inline .manage-svg{width:15px;height:15px}
.manage-row{justify-content:flex-end;margin-top:22px}
.manage-row[hidden]{display:none!important}
.section-head h2{font-size:16px}
.shortcut{font-size:12px}
.event-tile-name{font-size:13px}
.event-tile-date{font-size:11px}
.event-tile-count strong{font-size:19px}
.event-tile-count small{font-size:9px}
@media(max-width:520px){
 .page{padding:18px 14px 16px}
 .countdown{padding:17px 18px;gap:12px;border-radius:18px}
 .countdown-right{min-width:68px}
 .days-number{font-size:40px}
 .upcoming-head{align-items:flex-start}
 .upcoming-actions{gap:6px}
 .manage-link-inline{font-size:10px;padding:6px 7px;gap:4px}
 .manage-link-inline .manage-svg{display:none}
 .section-head h2{font-size:15px}
}
@media(max-width:390px){
 .countdown{flex-direction:row;align-items:center}
 .countdown-right{display:block;text-align:right;min-width:66px}
 .days-number{font-size:36px}
 .days-label{margin-top:5px}
 .upcoming-head{flex-wrap:wrap}
 .upcoming-actions{margin-left:auto}
}

/* v2.8: static event cards and simplified Events heading */
.event-tile{animation:none!important;animation-delay:0ms!important}
.upcoming-actions{display:none!important}

/* v2.9 empty-state hero invites adding the first/next event */
.countdown.empty-state{cursor:pointer;outline-offset:4px}
.countdown.empty-state:hover{border-color:var(--accent);filter:brightness(.99)}
.countdown.empty-state:focus-visible{outline:2px solid var(--accent)}
.countdown.empty-state .countdown-right{opacity:.78}

/* v3.0: tighter greeting header and Events management action */
.topbar{margin-bottom:0;min-height:0;padding-top:2px;padding-bottom:0}
.greeting{line-height:1.25}
.date-label{line-height:1.25}
.countdown{margin-top:24px}
.events-manage-link{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card,var(--surface,#fff));color:var(--muted);font-size:11px;line-height:1.2;text-decoration:none;white-space:nowrap;flex:0 0 auto}
.events-manage-link svg{width:14px;height:14px}
.events-manage-link:active{transform:scale(.98)}
.upcoming-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.upcoming-head h2{margin:0}
@media(max-width:420px){.events-manage-link{font-size:10px;padding:6px 8px;gap:4px}.events-manage-link svg{width:13px;height:13px}.countdown{margin-top:20px}}

</style>
</head>
<body>
<div class="page">
<header class="topbar">
  <div class="brand"><div id="greeting" class="greeting">Good afternoon</div></div>
  <div class="top-actions"><span id="dateLabel" class="date-label"></span></div>
</header>
<main>
  <section id="countdown" class="countdown" aria-live="polite" tabindex="0">
    <div class="countdown-left"><div class="section-tag"><span class="pulse"></span> NEXT UP</div><div id="eventName" class="event-name">No exam added yet</div><div id="eventMeta" class="event-meta">Tap here to add an event.</div><span id="expiryTag" class="expiry-tag" hidden>EXPIRY SOON</span></div>
    <div class="countdown-right"><div id="daysNumber" class="days-number">—</div><div id="daysLabel" class="days-label">DAYS LEFT</div></div>
  </section>
  <section id="allEventsSection" class="all-events-section" hidden>
    <div class="section-head upcoming-head"><h2>Events</h2><a class="events-manage-link" href="settings.html" aria-label="Manage events"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/></svg><span>Manage events</span><span aria-hidden="true">→</span></a></div>
    <div id="eventCards" class="event-cards"></div>
  </section>
  <section class="shortcuts-section">
    <div class="section-head"><h2>Quick access</h2></div>
    <div id="shortcuts" class="shortcuts">
      <a class="shortcut" href="https://www.google.com/" data-name="Google"><span class="shortcut-icon google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.7-.4-4H24v7.6h11a9.4 9.4 0 0 1-4.1 6.2v5h6.6c3.9-3.6 6.1-8.8 6.1-14.8Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.2A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.8a12 12 0 0 1 0-7.6V15H5.8a20 20 0 0 0 0 18Z"/><path fill="#EA4335" d="M24 11.8c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.8 29.5 4 24 4A20 20 0 0 0 5.8 15l6.8 5.2c1.6-4.8 6.1-8.4 11.4-8.4Z"/></svg></span><span>Google</span></a>
      <a class="shortcut" href="https://www.youtube.com/" data-name="YouTube"><span class="shortcut-icon youtube"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="10" width="40" height="28" rx="8" fill="#f22"/><path d="m20 17 12 7-12 7Z" fill="#fff"/></svg></span><span>YouTube</span></a>
      <a class="shortcut" href="https://mail.google.com/" data-name="Gmail"><span class="shortcut-icon gmail"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M7 38h7V19l-7-5z"/><path fill="#34A853" d="M34 38h7V14l-7 5z"/><path fill="#EA4335" d="M7 14v5l17 13 17-13v-5l-4-3-13 10L11 11z"/><path fill="#C5221F" d="M7 14v-1a4 4 0 0 1 6-3l4 3-3 6z"/><path fill="#FBBC04" d="M41 14v-1a4 4 0 0 0-6-3l-4 3 3 6z"/></svg></span><span>Gmail</span></a>
      <a class="shortcut" href="https://www.wikipedia.org/" data-name="Wikipedia"><span class="shortcut-icon wiki"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="currentColor" opacity=".12"/><text x="24" y="33" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="currentColor">W</text></svg></span><span>Wikipedia</span></a>
      <a class="shortcut" href="https://drive.google.com/" data-name="Drive"><span class="shortcut-icon drive"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#00832d" d="M16 34h24l-5 8H11z"/><path fill="#0066da" d="M11 42 4 30l13-22 7 12z"/><path fill="#ffba00" d="M17 8h14l13 22H30z"/></svg></span><span>Drive</span></a>
      <a class="shortcut" href="https://calendar.google.com/" data-name="Calendar"><span class="shortcut-icon calendar"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="10" width="34" height="32" rx="6" fill="#4285f4"/><path fill="#1967d2" d="M7 16h34v7H7z"/><path fill="#fff" d="M14 5h4v11h-4zm16 0h4v11h-4z"/><text x="24" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">31</text></svg></span><span>Calendar</span></a>
      <a class="shortcut" href="https://ssc.gov.in/" data-name="SSC"><span class="shortcut-icon ssc"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#e8eefc"/><text x="24" y="31" text-anchor="middle" font-size="21" font-weight="800" fill="#254b9b">SSC</text></svg></span><span>SSC</span></a>
      <a class="shortcut" href="https://www.india.gov.in/" data-name="India.gov"><span class="shortcut-icon india"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#f1f2f4"/><path d="M7 17h34v7H7z" fill="#f28c28"/><path d="M7 24h34v7H7z" fill="#fff"/><path d="M7 31h34v7H7z" fill="#138808"/><circle cx="24" cy="27.5" r="3.3" fill="none" stroke="#254b9b" stroke-width="1.4"/></svg></span><span>India.gov</span></a>
    </div>
  </section>
</main>
<footer><span id="footerStatus"></span></footer>
</div>
<script>
(() => {
 const KEY='countdownHome.events.v2', OLD='examCountdown.events.v1';
 const $=id=>document.getElementById(id);
 const get=async()=>{try{const raw=localStorage.getItem(KEY)||localStorage.getItem(OLD)||'[]';const d=JSON.parse(raw);return Array.isArray(d)?d:[]}catch(_){return []}};
 const diff=s=>{const [y,m,d]=s.split('-').map(Number),n=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000)};
 const fmt=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})};
 const icon=category=>category==='Exam'?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 3v5h5M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function dayStyle(n){if(n<=1)return 'orange';if(n<=7)return 'red';if(n<=30)return 'blue';return 'green'}
 function updateClock(){const now=new Date();const hour=now.getHours();$('greeting').textContent=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';$('dateLabel').textContent=now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});}
 function render(all){
  all=all.filter(e=>e&&typeof e.name==='string'&&typeof e.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date))
    .map(e=>({...e,category:String(e.category||'Event').toLowerCase()==='exam'?'Exam':'Event'}));
  all.sort((a,b)=>a.date.localeCompare(b.date));
  const upcoming=all.filter(e=>diff(e.date)>=0),next=upcoming[0],hero=$('countdown');
  hero.classList.remove('urgent','last-day');$('expiryTag').hidden=true;
  if(next){
   const n=diff(next.date);$('eventName').textContent=next.name;$('eventMeta').textContent=fmt(next.date)+' · '+(next.category||'Event');
   $('daysNumber').textContent=n===0?'Today':String(n);$('daysLabel').textContent=n===0?'EVENT DAY':n===1?'DAY LEFT':'DAYS LEFT';
   $('daysNumber').style.color=n===0?'#d13e3e':n===1?'#d97706':n<=7?'#d13e3e':n<=30?'#4778d5':'#24966b';
   if(n<=1){hero.classList.add('urgent');$('expiryTag').hidden=false;$('expiryTag').textContent=n===0?'EXPIRES TODAY':'EXPIRY SOON';if(n===0)hero.classList.add('last-day')}
  }else{$('eventName').textContent=all.length?'No upcoming events':'No exam added yet';$('eventMeta').textContent=all.length?'All saved dates have passed. Add your next target in Settings.':'Add an exam or event in Settings.';$('daysNumber').textContent='—';$('daysLabel').textContent='DAYS LEFT';$('daysNumber').style.color='var(--accent)'}
  const emptyState=!next;
  hero.classList.toggle('empty-state',emptyState);
  hero.setAttribute('role',emptyState?'link':'region');
  hero.setAttribute('aria-label',emptyState?'No upcoming events. Tap to add an event.':'Next upcoming countdown');
  hero.tabIndex=emptyState?0:-1;
  if(emptyState){$('eventMeta').textContent=all.length?'All saved dates have passed. Tap here to add an event.':'Tap here to add an event.';}
  const section=$('allEventsSection'),cards=$('eventCards');
  const nextIndex=next?upcoming.indexOf(next):-1;const remaining=next?upcoming.filter((e,i)=>i!==nextIndex):upcoming;
  if(remaining.length>0){section.hidden=false;cards.innerHTML=remaining.map(e=>{
    const n=diff(e.date),urg=n<=1,lab=n===0?'TODAY':n===1?'1 DAY LEFT':n+' DAYS LEFT',color=dayStyle(n);
    return `<article class="event-tile ${urg?'expiring':''}" style="--item-index:${upcoming.indexOf(e)}"><div class="event-type-icon">${icon(e.category||'Event')}</div><div class="event-tile-main"><div class="event-tile-name">${esc(e.name)}</div><div class="event-tile-date">${esc(fmt(e.date))} · ${esc(e.category||'Event')}</div>${urg?`<span class="expiry-mini">${n===0?'EXPIRES TODAY':'EXPIRY SOON'}</span>`:''}</div><div class="event-tile-count"><strong class="${color}">${n===0?'Today':n}</strong><small>${n===0?'EVENT DAY':n===1?'DAY LEFT':'DAYS LEFT'}</small></div></article>`;
   }).join('')}else{section.hidden=true;cards.innerHTML=''}
 }
 const hero=$('countdown');
 hero.addEventListener('click',()=>{if(hero.classList.contains('empty-state'))location.href='settings.html'});
 hero.addEventListener('keydown',ev=>{if(hero.classList.contains('empty-state')&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();location.href='settings.html'}});
 async function init(){updateClock();setInterval(updateClock,30000);try{const all=await get();render(all);document.documentElement.dataset.theme='system';}catch(err){console.error('Countdown Home failed to render events:',err);const section=$('allEventsSection');if(section){section.hidden=false;const cards=$('eventCards');if(cards)cards.textContent='Unable to load events. Open Manage events to review your saved countdowns.';}}}
 init();
})();
</script>
