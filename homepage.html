<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
<meta name="description" content="A personal homepage with countdowns, notes, and custom shortcuts.">
<meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
<title>Homepage</title>

<style>
/* 
  MODERN NATIVE APP UI DESIGN 
  Animations, touch-states, fluid layouts, frosted bottom sheets
*/

:root {
  color-scheme: light;
  --bg: #f9f9f9;
  --panel: #ffffff;
  --text: #1a1a1a;
  --text-soft: #4a4a4a;
  --muted: #8e8e93;
  --line: #e2e2e7;
  --accent: #0a84ff;
  --hero-a: #ffffff;
  --hero-b: #f0f4fa;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
  --shadow-sheet: 0 -8px 32px rgba(0,0,0,0.1);
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --border-w: 1px;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #131313;
    --panel: #1c1c1e;
    --text: #f5f5f7;
    --text-soft: #a1a1a6;
    --muted: #636366;
    --line: #38383a;
    --accent: #0a84ff;
    --hero-a: #1c1c1e;
    --hero-b: #161d27;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-sheet: 0 -12px 40px rgba(0,0,0,0.5);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

::-webkit-scrollbar { display: none; }
html { scrollbar-width: none; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
}

input, select, textarea { -webkit-user-select: auto; user-select: auto; font-family: inherit; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: none; background: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea:focus-visible { outline: none !important; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
[hidden] { display: none !important; }

/* Active Touch States */
button:active, .shortcut:active, .event-tile:active, .countdown:active, .task-item:active {
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Animations */
@keyframes slideUpFade {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseRed {
  0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.3); border-color: rgba(255, 59, 48, 0.8); }
  70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); border-color: rgba(255, 59, 48, 0.3); }
  100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); border-color: rgba(255, 59, 48, 0.8); }
}

@keyframes pulseOrange {
  0% { box-shadow: 0 0 0 0 rgba(255, 149, 0, 0.3); border-color: rgba(255, 149, 0, 0.8); }
  70% { box-shadow: 0 0 0 10px rgba(255, 149, 0, 0); border-color: rgba(255, 149, 0, 0.3); }
  100% { box-shadow: 0 0 0 0 rgba(255, 149, 0, 0); border-color: rgba(255, 149, 0, 0.8); }
}

/* `both` ensures element is strictly invisible during the animation delay phase */
.animate-in {
  animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

/* Standalone Pulses & Tints */
.pulse-border-red { animation: pulseRed 2.5s infinite; border-color: rgba(255, 59, 48, 1) !important;}
.pulse-border-orange { animation: pulseOrange 2.5s infinite; border-color: rgba(255, 149, 0, 1) !important;}

.bg-tint-red { background: rgba(255, 59, 48, 0.08) !important; border-color: rgba(255, 59, 48, 0.3) !important; }
.bg-tint-orange { background: rgba(255, 149, 0, 0.08) !important; border-color: rgba(255, 149, 0, 0.3) !important; }

@media (prefers-color-scheme: dark) {
  .bg-tint-red { background: rgba(255, 59, 48, 0.15) !important; border-color: rgba(255, 59, 48, 0.4) !important; }
  .bg-tint-orange { background: rgba(255, 149, 0, 0.15) !important; border-color: rgba(255, 149, 0, 0.4) !important; }
}

/* Combined Pulses for Initial Entry */
.animate-in.pulse-border-red { animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both, pulseRed 2.5s infinite 0.6s !important; }
.animate-in.pulse-border-orange { animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both, pulseOrange 2.5s infinite 0.6s !important; }

/* Page Layout */
.page-container { position: relative; width: 100%; max-width: 800px; margin: auto; min-height: 100vh; }
.home-page { padding: 24px 20px 40px; transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); transform-origin: top center; }
.home-page.hidden { opacity: 0; transform: scale(0.94); pointer-events: none; position: absolute; width: 100%; }

.manager-page {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100;
  overflow-y: auto; padding: 24px 20px 80px; opacity: 0; transform: translateY(30px); pointer-events: none;
  transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.manager-page.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
.manager-inner { max-width: 800px; margin: auto; }

/* Header */
.welcome { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.greeting { font-size: clamp(24px, 5vw, 32px); font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
.header-right { display: flex; align-items: center; gap: 12px; }
.date-label-text { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.edit-link { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow-sm); color: var(--text-soft); transition: all 0.2s; border: var(--border-w) solid var(--line); }
.edit-link:hover { color: var(--accent); transform: scale(1.05); }
.edit-link svg { width: 18px; height: 18px; }

/* Hero Countdown */
.countdown {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 24px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  box-shadow: var(--shadow-md); border: var(--border-w) solid var(--line);
  transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 12px; 
}
@media (prefers-color-scheme: dark) {
  .countdown { border-color: rgba(255,255,255,0.08); }
}
.countdown-left { flex: 1; min-width: 0; }
.event-name { margin: 0 0 4px; font-size: clamp(22px, 4.5vw, 28px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; overflow-wrap: anywhere; }
.event-meta { color: var(--text-soft); font-size: 14px; font-weight: 600; }
.countdown-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px; flex-shrink: 0; text-align: right; }
.days-number { font-size: clamp(42px, 8vw, 56px); font-weight: 800; letter-spacing: -0.04em; color: var(--accent); line-height: 1; }
.days-number.text-word { font-size: clamp(26px, 6vw, 34px); letter-spacing: -0.01em; }
.days-label { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

/* Upcoming Events Grid */
.event-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
.event-tile {
  display: flex; flex-direction: column; justify-content: space-between; gap: 24px;
  padding: 20px 16px; border-radius: var(--radius-lg); background: var(--panel); 
  box-shadow: var(--shadow-sm); transition: transform 0.2s; border: var(--border-w) solid var(--line);
}
.event-tile-name { font-size: 15px; font-weight: 700; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.event-tile-bottom { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; gap: 8px; }
.event-tile-date { font-size: 12px; font-weight: 600; color: var(--text-soft); padding-bottom: 3px; white-space: nowrap; }
.event-tile-count { text-align: right; }
.event-tile-count strong { font-size: 26px; font-weight: 800; line-height: 1; display: block; }
.event-tile-count strong.text-word-sm { font-size: 19px; letter-spacing: -0.01em; padding-bottom: 2px;}

/* Numeric Colors */
.orange { color: #ff9500; } .red { color: #ff3b30; } .blue { color: #0a84ff; } .green { color: #28cd41; }
.empty-note { padding: 16px; border: var(--border-w) dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }

/* Sections */
.section { margin-top: 16px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; min-height: 24px;}
.section-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); white-space: nowrap; }

/* Unified Smart Notes & Tasks Widget */
.smart-widget {
  background: var(--panel); border-radius: var(--radius-lg); border: var(--border-w) solid var(--line);
  box-shadow: var(--shadow-sm); display: flex; flex-direction: column; margin-bottom: 24px;
  overflow: hidden;
}
.smart-widget-notes-wrapper { position: relative; display: flex; width: 100%; }
.smart-widget-notes {
  flex: 1; width: 100%; border: none; background: transparent; color: var(--text);
  font-size: 15px; font-weight: 500; resize: none; outline: none; line-height: 1.5; 
  padding: 20px 90px 20px 20px; /* high right padding prevents text from overlapping button */
  overflow: hidden; min-height: 62px;
  /* Removed transition: height to solve vertical clipping */
}
.smart-widget-notes::placeholder { color: var(--muted); }

/* Smart inline Add Task button */
.add-task-btn {
  position: absolute; right: 12px; bottom: 14px;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 8px 12px; border-radius: 20px;
  background: transparent; color: var(--accent);
  font-size: 15px; font-weight: 700; cursor: pointer;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.1s;
}
.add-task-btn svg { width: 16px; height: 16px; }

/* Only show button if notes wrapper is focused AND has text */
.smart-widget-notes-wrapper.has-text:focus-within .add-task-btn,
.add-task-btn:active {
  opacity: 1; pointer-events: auto;
}

.smart-widget-divider { height: var(--border-w); background: var(--line); margin: 0 20px; transition: opacity 0.2s; }

.smart-widget-tasks { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 4px; }
.task-item { 
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; 
  padding: 8px 12px; margin: 0 -12px; border-radius: 10px; transition: background 0.2s, transform 0.1s;
  cursor: pointer;
}
.task-item:active { background: var(--line); }
.task-content { 
  flex: 1; font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4;
  white-space: normal; word-break: break-word; transition: color 0.2s; 
  display: flex; align-items: flex-start; gap: 12px; padding-top: 1px;
}
.task-item.done .task-content { text-decoration: line-through; color: var(--muted); }
.task-bullet { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 7px; transition: background 0.2s; }
.task-item.done .task-bullet { background: var(--muted); }
.task-delete { color: var(--muted); background: transparent; border: none; font-size: 22px; cursor: pointer; opacity: 0.5; padding: 0 4px; line-height: 1;}
.task-delete:hover { opacity: 1; color: #ff3b30; }

/* Shortcuts (Perfect Strict Grid) */
.shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px 8px; }
@media (min-width: 600px) { .shortcuts { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 800px) { .shortcuts { grid-template-columns: repeat(8, 1fr); } }

.shortcut { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; transition: transform 0.2s; }
.shortcut-icon {
  width: 62px; height: 62px; display: grid; place-items: center;
  border-radius: 18px; background: var(--panel); box-shadow: var(--shadow-sm);
  font-size: 24px; color: var(--text); border: var(--border-w) solid var(--line);
}
.shortcut-icon svg { width: 30px; height: 30px; }
.shortcut-label { font-size: 11px; font-weight: 600; color: var(--text-soft); width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shortcut-add .shortcut-icon svg { color: var(--muted); }

/* BOTTOM SHEET MODALS (Frosted Glass, No Dim) */
.modal-backdrop {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
  display: flex; align-items: flex-end; justify-content: center;
  background: transparent; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.modal-backdrop.active { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--panel); border: none; border-top: var(--border-w) solid var(--line);
  border-radius: 28px 28px 0 0; padding: 12px 24px 50px; 
  width: 100%; max-width: 800px; box-shadow: var(--shadow-sheet);
  transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  position: relative;
}
.modal-backdrop.active .modal-box { transform: translateY(0); }
.modal-drag-handle { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 24px; }

/* Forms Inside Modals */
.modal-box .panel-title { font-size: 22px; font-weight: 800; margin: 0 0 20px; color: var(--text); letter-spacing: -0.02em; }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.field label { font-size: 12px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.05em; }
.field input { width: 100%; padding: 16px; border-radius: var(--radius-sm); border: var(--border-w) solid var(--line); background: var(--bg); color: var(--text); font-size: 16px; font-weight: 500; transition: border 0.2s; }
.form-actions { display: flex; gap: 12px; margin-top: 28px; }
.button { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 16px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; background: var(--bg); border: var(--border-w) solid var(--line); color: var(--text); transition: transform 0.1s, opacity 0.2s; }
.button:active { transform: scale(0.96); }
.button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(10,132,255,0.3); }
.button.danger { color: #ff3b30; background: rgba(255,59,48,0.1); border-color: transparent; }
.status { min-height: 20px; margin: 12px 0 0; color: var(--muted); font-size: 13px; text-align: center;}

.shortcut-preview { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg); border: var(--border-w) dashed var(--line); border-radius: var(--radius-sm); }
.shortcut-preview .shortcut-icon { flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; box-shadow: none; }
.shortcut-preview .shortcut-icon svg { width: 22px; height: 22px; }
.shortcut-preview-text { min-width: 0; }
.shortcut-preview-text strong { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shortcut-preview-text small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

/* Manager Lists */
.manager-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding-bottom: 16px; border-bottom: var(--border-w) solid var(--line); }
.back-button { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow-sm); color: var(--text); transition: transform 0.2s; border: var(--border-w) solid var(--line); }
.back-button svg { width: 20px; height: 20px; margin-right: 2px; }
.manager-title { font-size: 24px; font-weight: 800; margin: 0; }
.manager-subtitle { font-size: 13px; color: var(--text-soft); margin-top: 2px; }

.manager-content { display: grid; grid-template-columns: 1fr; gap: 40px; }
@media(min-width: 768px) { .manager-content { grid-template-columns: 1fr 1fr; } }

.list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 16px;}
.list-header .panel-title { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap;}
.add-btn-small { flex: 1; max-width: 250px; padding: 12px 14px; border-radius: 100px; font-size: 15px; margin: 0; box-shadow: 0 4px 12px rgba(10,132,255,0.3); }

/* Stacked Manage Items */
.manage-list { display: flex; flex-direction: column; gap: 16px; }
.manage-item { 
  display: flex; flex-direction: column; align-items: stretch; gap: 16px; 
  padding: 16px; border-radius: var(--radius-md); 
  background: var(--panel); border: var(--border-w) solid var(--line); box-shadow: var(--shadow-sm);
}
.manage-item-top { display: flex; gap: 12px; align-items: center; overflow: hidden; }
.manage-item-details { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.manage-item-details strong { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.manage-item-details small { font-size: 13px; color: var(--text-soft); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.manage-item-actions { display: flex; gap: 12px; }
.manage-item-actions button { 
  flex: 1; padding: 12px; font-size: 14px; font-weight: 700; 
  border-radius: 10px; background: var(--bg); border: var(--border-w) solid var(--line); color: var(--text); min-height: 0;
}
.manage-item-actions button.danger { background: rgba(255,59,48,0.1); color: #ff3b30; border-color: transparent; }
@media (prefers-color-scheme: dark) {
  .manage-item-actions button { background: #2c2c2e; border-color: #3a3a3c; }
  .manage-item-actions button.danger { background: rgba(255,69,58,0.15); }
}

@media (max-width: 500px) {
  .event-cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}
</style>
</head>

<body>

<div class="page-container">
  
  <!-- HOME PAGE -->
  <main class="home-page" id="homePage">
    <section class="welcome animate-in" style="animation-delay: 0s">
      <div id="greeting" class="greeting">Hello</div>
      <div class="header-right">
        <button class="edit-link" id="openSettings" type="button" aria-label="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </section>

    <!-- Hero Countdown -->
    <section id="countdown" class="countdown animate-in" style="animation-delay: 0.1s" aria-live="polite">
      <div class="countdown-left">
        <div id="eventName" class="event-name">Loading...</div>
        <div id="eventMeta" class="event-meta">...</div>
      </div>
      <div class="countdown-right">
        <div id="daysNumber" class="days-number">—</div>
        <div id="daysLabel" class="days-label">DAYS LEFT</div>
      </div>
    </section>

    <!-- Event Cards Grid -->
    <section id="allEventsSection" hidden>
      <div id="eventCards" class="event-cards"></div>
    </section>

    <!-- Unified Smart Notes & Tasks Widget (Directly below events) -->
    <section class="animate-in" style="animation-delay: 0.2s; margin-bottom: 24px;" id="notesTasksSection">
      <div class="smart-widget" id="smartWidget">
        
        <!-- Notes Area -->
        <div class="smart-widget-notes-wrapper" id="notesWrapper">
          <textarea id="notesArea" class="smart-widget-notes" placeholder="Jot down quick notes..." rows="1"></textarea>
          <button id="addTaskFromNoteBtn" class="add-task-btn" type="button" title="Add as task">
            + Task
          </button>
        </div>
        
        <div id="smartDivider" class="smart-widget-divider" hidden></div>
        
        <!-- Tasks Area -->
        <div class="smart-widget-tasks" id="smartTasksContainer" hidden>
          <div class="tasks-list" id="tasksList"></div>
        </div>
      </div>
    </section>

    <!-- Shortcuts -->
    <section class="section">

  function validDate(value) {
    if (typeof value !== "string") return false;
    const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) return false;
    const year = Number(match[1]), month = Number(match[2]), day = Number(match[3]);
    const date = new Date(year, month - 1, day);
    return (date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day);

  function dayDiff(value) {
    const [year, month, day] = value.split("-").map(Number);
    const [todayYear, todayMonth, todayDay] = dateToday().split("-").map(Number);
    return Math.round((Date.UTC(year, month - 1, day) - Date.UTC(todayYear, todayMonth - 1, todayDay)) / 86400000);
  }
  
  function formatDateFull(value) {
    const [year, month, day] = value.split("-").map(Number);
    return new Date(year, month - 1, day, 12).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  function formatDateShort(value) {

  const iconColors = ["#E85D75", "#8E44AD", "#3498DB", "#16A085", "#E67E22", "#2C3E50", "#D35400", "#2980B9", "#C0392B", "#27AE60", "#6C5CE7", "#F39C12", "#00A8A8"];
  function getDomain(url) { try { return new URL(url).hostname.replace(/^www\./, "").toLowerCase(); } catch { return ""; } }
  
  function domainIconData(url) {
    const domain = getDomain(url);
    let hash = 0; for (let i = 0; i < domain.length; i++) hash = ((hash << 5) - hash) + domain.charCodeAt(i);
    const color = iconColors[Math.abs(hash) % iconColors.length];
    const parts = domain.split(".");
    const initial = (parts.length > 1 ? parts[parts.length - 2] : parts[0]).charAt(0).toUpperCase() || "W";
    return { color, initial };
  }

  const defaultShortcuts = [
    { id: "default-google", name: "Google", url: "https://www.google.com/", icon: "google" },
    { id: "default-youtube", name: "YouTube", url: "https://www.youtube.com/", icon: "youtube" },
    { id: "default-assamcareer", name: "AssamCareer", url: "https://assamcareer.com/", icon: "assamcareer" },
    { id: "default-gmail", name: "Gmail", url: "https://mail.google.com/", icon: "gmail" },
    { id: "default-amazon", name: "Amazon", url: "https://www.amazon.in/", icon: "amazon" },
    { id: "default-flipkart", name: "Flipkart", url: "https://www.flipkart.com/", icon: "flipkart" }
  ];

  /* Data Normalization */
  function normalizeUrl(urlStr) {
    let url = String(urlStr || "").trim(); if (!url) return "";
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    try { const p = new URL(url); return (p.protocol === "http:" || p.protocol === "https:") && p.hostname.includes(".") ? p.href : ""; } catch { return ""; }
  }
  function normalizeEvents(arr) {
    return Array.isArray(arr) ? arr.map(e => ({ id: String(e.id || createId()), name: String(e.name).trim().slice(0, 100), date: e.date })).filter(e => e.name && validDate(e.date)) : [];
  }
  function normalizeShortcuts(arr) {
    return Array.isArray(arr) ? arr.map(s => { const url = normalizeUrl(s.url); return { id: String(s.id || createId()), name: String(s.name || getDomain(url)).trim().slice(0, 50), url }; }).filter(s => s.url) : [];
  }
  function normalizeTasks(arr) {
    return Array.isArray(arr) ? arr.map(t => ({ id: String(t.id || createId()), text: String(t.text).trim().slice(0, 200), done: !!t.done })).filter(t => t.text) : [];
  }

  /* Cache & Sync Logic */
  function load() {
    try { let r = localStorage.getItem(EVENTS_KEY); events = r ? normalizeEvents(JSON.parse(r)) : []; } catch { events = []; }
    try { const r = localStorage.getItem(SHORTCUTS_KEY); customShortcuts = r ? normalizeShortcuts(JSON.parse(r)) : []; } catch { customShortcuts = []; }
    try { const r = localStorage.getItem(NOTES_KEY); notesText = r || ""; } catch { notesText = ""; }
    try { const r = localStorage.getItem(TASKS_KEY); tasksList = r ? normalizeTasks(JSON.parse(r)) : []; } catch { tasksList = []; }
    lastUpdateTimestamp = parseInt(localStorage.getItem('syncTimestamp') || '0', 10);
  }
  function pushToFirebase() {
    lastUpdateTimestamp = Date.now(); localStorage.setItem('syncTimestamp', lastUpdateTimestamp.toString());
    set(ref(db, FIREBASE_PATH), { events, shortcuts: customShortcuts, notes: notesText, tasks: tasksList, updatedAt: lastUpdateTimestamp }).catch(console.error);
  }
  function pushToFirebaseDebounced() {
    clearTimeout(syncTimeout);
    syncTimeout = setTimeout(pushToFirebase, 1200);
  }
  
  function saveEvents() { try { localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); pushToFirebase(); return true; } catch { return false; } }
  function saveShortcuts() { try { localStorage.setItem(SHORTCUTS_KEY, JSON.stringify(customShortcuts)); pushToFirebase(); return true; } catch { return false; } }
  function saveTasks() { try { localStorage.setItem(TASKS_KEY, JSON.stringify(tasksList)); pushToFirebase(); return true; } catch { return false; } }
  function saveNotes() { try { localStorage.setItem(NOTES_KEY, notesText); pushToFirebaseDebounced(); return true; } catch { return false; } }

  // Sync happens completely silently in background
  function initFirebaseSync() {
    onValue(ref(db, FIREBASE_PATH), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const remoteTimestamp = data.updatedAt || 0;
        
        const localStr = JSON.stringify({ e: events, s: customShortcuts, n: notesText, t: tasksList });
        const remoteStr = JSON.stringify({ e: normalizeEvents(data.events), s: normalizeShortcuts(data.shortcuts), n: data.notes || "", t: normalizeTasks(data.tasks) });
        
        if (localStr !== remoteStr && (remoteTimestamp > lastUpdateTimestamp || lastUpdateTimestamp === 0)) {
          events = normalizeEvents(data.events); customShortcuts = normalizeShortcuts(data.shortcuts);
          notesText = data.notes || ""; tasksList = normalizeTasks(data.tasks);
          lastUpdateTimestamp = remoteTimestamp;
          
          localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); localStorage.setItem(SHORTCUTS_KEY, JSON.stringify(customShortcuts)); 
          localStorage.setItem(NOTES_KEY, notesText); localStorage.setItem(TASKS_KEY, JSON.stringify(tasksList));
          localStorage.setItem('syncTimestamp', lastUpdateTimestamp.toString());
          
          renderHome(); 
          renderTasks();
          if (document.activeElement !== $("notesArea")) {
            $("notesArea").value = notesText;
            autoResizeTextarea($("notesArea"));
          }
          if ($("managerPage").classList.contains("active")) { renderManage(); renderShortcutSettings(); }
          
        } else if (lastUpdateTimestamp > remoteTimestamp) { pushToFirebase(); }
      } else if (events.length > 0 || customShortcuts.length > 0 || tasksList.length > 0 || notesText) { pushToFirebase(); }
    });
  }

  /* Textareas & Inputs */
  function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  $("notesArea").addEventListener("input", (e) => { 
    notesText = e.target.value; 
    saveNotes(); 
    autoResizeTextarea(e.target);
    e.target.parentElement.classList.toggle("has-text", notesText.trim().length > 0);
  });
  
  // Extract line from note into a task
  $("addTaskFromNoteBtn").addEventListener("mousedown", (e) => {
    e.preventDefault(); 
    const ta = $("notesArea");
    let text = ta.value;
    const cursorPosition = ta.selectionStart;

    if (!text.trim()) return;

    let start = text.lastIndexOf('\n', cursorPosition - 1);
    start = start === -1 ? 0 : start + 1;
    let end = text.indexOf('\n', cursorPosition);
    end = end === -1 ? text.length : end;

    const lineText = text.substring(start, end).trim();

    if (lineText) {
      tasksList.push({ id: createId(), text: lineText, done: false });
      
      let before = text.substring(0, start);
      let after = text.substring(end);
      
      if (before.endsWith('\n') && after.startsWith('\n')) {
          after = after.substring(1);
      } else if (before === '' && after.startsWith('\n')) {
          after = after.substring(1);
      }
      
      let newText = before + after;
      ta.value = newText;
      notesText = newText;
      
      saveNotes(); saveTasks(); renderTasks(); autoResizeTextarea(ta);
      ta.parentElement.classList.toggle("has-text", notesText.trim().length > 0);
    }
  });

  /* Unified Task List Long Press Logic */
  $("tasksList").addEventListener("touchstart", handleTaskPressStart, {passive: true});
  $("tasksList").addEventListener("mousedown", handleTaskPressStart);
  
  $("tasksList").addEventListener("touchend", handleTaskPressEnd);
  $("tasksList").addEventListener("touchmove", handleTaskPressCancel, {passive: true});
  $("tasksList").addEventListener("mouseup", handleTaskPressEnd);
  $("tasksList").addEventListener("mouseleave", handleTaskPressCancel);
  
  function handleTaskPressStart(e) {
    const item = e.target.closest('.task-item');
    if (!item || e.target.closest('.task-delete')) return; 
    
    pressTimer = setTimeout(() => {
      const id = item.dataset.id;
      const task = tasksList.find(t => t.id === id);
      if(task) { 
        task.done = !task.done; 
        saveTasks(); 
        renderTasks();
        if (navigator.vibrate) navigator.vibrate(50);
      }
    }, PRESS_DELAY);
  }

  function handleTaskPressEnd() { clearTimeout(pressTimer); }
  function handleTaskPressCancel() { clearTimeout(pressTimer); }
  
  $("tasksList").onclick = e => {
    if (e.target.closest('.task-delete')) {
      const id = e.target.closest('.task-delete').dataset.id;
      if (confirm("Delete this task?")) {
        tasksList = tasksList.filter(t => t.id !== id);
        saveTasks(); renderTasks();
      }
    }
  };

  function updateShortcutPreview() {
    const rawUrl = $("shortcutUrlInput").value.trim();
    const url = normalizeUrl(rawUrl);
    const customName = $("shortcutNameInput").value.trim();
    if (!url) {
      $("shortcutPreviewIcon").style.background = 'var(--bg)';
      $("shortcutPreviewIcon").innerHTML = `<svg viewBox="0 0 48 48"><text x="24" y="32" font-size="24" font-weight="800" text-anchor="middle" fill="var(--muted)">W</text></svg>`;
      $("shortcutPreviewName").textContent = customName || "Website preview";
      $("shortcutPreviewDomain").textContent = "Enter a valid website URL";
      return;
    }
    const domain = getDomain(url);
    const { color, initial } = domainIconData(url);
    
    $("shortcutPreviewIcon").style.background = color;
    $("shortcutPreviewIcon").innerHTML = `<span style="color:#ffffff; font-size: 22px; font-weight:800; font-family:sans-serif;">${escapeHTML(initial)}</span>`;
    $("shortcutPreviewName").textContent = customName || domain;
    $("shortcutPreviewDomain").textContent = domain;
  }
  $("shortcutUrlInput").addEventListener("input", updateShortcutPreview);
  $("shortcutNameInput").addEventListener("input", updateShortcutPreview);

  /* UI Rendering */
  function renderTasks() {
    const list = $("tasksList");
    const div = $("smartDivider");
    const container = $("smartTasksContainer");

    if (tasksList.length === 0) {
      list.innerHTML = "";
      if (div) div.hidden = true;
      if (container) container.hidden = true;
    } else {
      if (div) div.hidden = false;
      if (container) container.hidden = false;
      
      list.innerHTML = tasksList.map(t => `
        <div class="task-item ${t.done ? 'done' : ''}" data-id="${t.id}">
          <div class="task-content">
            <div class="task-bullet"></div>
            ${escapeHTML(t.text)}
          </div>
          <button class="task-delete" data-id="${t.id}">×</button>
        </div>
      `).join("");
    }
  }

  function renderShortcuts() {
    const arr = [...defaultShortcuts, ...customShortcuts.map(s => ({ ...s, isCustom: true }))];
    const anim = isInitialRender ? 'animate-in' : '';
    const getDelay = (i) => isInitialRender ? `style="animation-delay: ${0.4 + (i * 0.03)}s"` : '';

    $("shortcutGrid").innerHTML = arr.map((s, i) => {
      if (s.isCustom) {
        const { color, initial } = domainIconData(s.url);
        return `
          <a class="shortcut ${anim}" ${getDelay(i)} href="${escapeHTML(s.url)}" target="_blank" rel="noopener">
            <span class="shortcut-icon" style="background: ${color}; color: #ffffff; font-size: 28px; font-weight: 800; border: none; box-shadow: 0 4px 12px ${color}40;">${escapeHTML(initial)}</span>
            <span class="shortcut-label">${escapeHTML(s.name)}</span>
          </a>
        `;
      } else {
        return `
          <a class="shortcut ${anim}" ${getDelay(i)} href="${escapeHTML(s.url)}" target="_blank" rel="noopener">
            <span class="shortcut-icon">${svgIcon(s.icon)}</span>
            <span class="shortcut-label">${escapeHTML(s.name)}</span>
          </a>
        `;
      }
    }).join("") + `
      <button class="shortcut shortcut-add ${anim}" ${getDelay(arr.length)} id="addShortcutTile" type="button">
        <span class="shortcut-icon">${svgIcon("plus")}</span><span class="shortcut-label">Add</span>
      </button>`;
    
    $("addShortcutTile").addEventListener("click", () => { 
      resetShortcutForm(); openShortcutModal(); $("shortcutNameInput").focus(); 
    });
  }

  function renderHome() {
    const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
    const upcoming = sorted.filter(e => dayDiff(e.date) >= 0);
    const hero = $("countdown");
    const daysNumEl = $("daysNumber");
    const daysLabEl = $("daysLabel");

    if (upcoming[0]) {
      const n = dayDiff(upcoming[0].date);
      $("eventName").textContent = upcoming[0].name; 
      $("eventMeta").textContent = `${formatDateFull(upcoming[0].date)}`;
      
      let urgentClass = "", pulseClass = "", tintClass = "";

      if (n === 0) {
        daysNumEl.textContent = "Today";
        daysNumEl.classList.add("text-word");
        daysLabEl.hidden = true;
        daysNumEl.style.color = "#ff3b30";
        urgentClass = "urgent last-day";
        pulseClass = "pulse-border-red";
        tintClass = "bg-tint-red";
      } else if (n === 1) {
        daysNumEl.textContent = "Tomorrow";
        daysNumEl.classList.add("text-word");
        daysLabEl.hidden = true;
        daysNumEl.style.color = "#ff9500";
        urgentClass = "urgent";
        pulseClass = "pulse-border-orange";
        tintClass = "bg-tint-orange";
      } else {
        daysNumEl.textContent = n;
        daysNumEl.classList.remove("text-word");
        daysLabEl.textContent = "DAYS LEFT";
        daysLabEl.hidden = false;
        daysNumEl.style.color = n <= 7 ? "#ff3b30" : n <= 30 ? "#0a84ff" : "#28cd41";
        if (n <= 7) urgentClass = "urgent";
      }

      hero.className = `countdown ${urgentClass} ${pulseClass} ${tintClass} ${isInitialRender ? 'animate-in' : ''}`;
      hero.style.animationDelay = isInitialRender ? "0.1s" : "0s";
      hero.removeAttribute("tabindex"); hero.removeAttribute("role");
    } else {
      $("eventName").textContent = events.length ? "No upcoming events" : "Add a countdown";
      $("eventMeta").textContent = events.length ? "All dates passed." : "Tap here to begin.";
      daysNumEl.textContent = "—"; daysLabEl.textContent = "DAYS LEFT"; daysNumEl.style.color = "var(--accent)";
      daysNumEl.classList.remove("text-word"); daysLabEl.hidden = false;
      hero.className = `countdown empty-state ${isInitialRender ? 'animate-in' : ''}`;
      hero.style.animationDelay = isInitialRender ? "0.1s" : "0s";
      hero.setAttribute("role", "button"); hero.setAttribute("tabindex", "0");
    }

    const rest = upcoming.slice(1);
    $("allEventsSection").hidden = !rest.length;
    
    $("eventCards").innerHTML = rest.map((e, i) => {
      const n = dayDiff(e.date);
      const isToday = n === 0;
      const isTomorrow = n === 1;
      
      let pulseCls = "";
      let tintCls = "";
      
      if (isToday) {
        pulseCls = "pulse-border-red";
        tintCls = "bg-tint-red";
      } else if (isTomorrow) {
        pulseCls = "pulse-border-orange";
        tintCls = "bg-tint-orange";
      }
      
      const color = isToday ? "red" : n <= 7 ? "orange" : n <= 30 ? "blue" : "green";
      
      const val = isToday ? "Today" : isTomorrow ? "Tomorrow" : n;
      const textClass = (isToday || isTomorrow) ? "text-word-sm" : "";
      
      const animCls = isInitialRender ? "animate-in" : "";
      const delayStyle = isInitialRender ? `style="animation-delay: ${0.15 + (i * 0.05)}s"` : "";

      return `
        <article class="event-tile ${animCls} ${pulseCls} ${tintCls}" ${delayStyle}>
          <div class="event-tile-name">${escapeHTML(e.name)}</div>
          <div class="event-tile-bottom">
            <div class="event-tile-date">${escapeHTML(formatDateShort(e.date))}</div>
            <div class="event-tile-count">
              <strong class="${color} ${textClass}">${val}</strong>
            </div>
          </div>
        </article>
      `;
    }).join("");
    
    renderShortcuts();
  }

  /* Manager Logic */
  function renderManage() {
    $("manageList").innerHTML = events.length ? [...events].sort((a,b)=>a.date.localeCompare(b.date)).map(e => `
      <div class="manage-item">
        <div class="manage-item-top">
          <div class="manage-item-details">
            <strong>${escapeHTML(e.name)}</strong>
            <small>${escapeHTML(formatDateFull(e.date))}${dayDiff(e.date) < 0 ? " (Past)" : ""}</small>
          </div>
        </div>
        <div class="manage-item-actions">
          <button class="button" data-edit="${e.id}">Edit</button>
          <button class="button danger" data-delete="${e.id}">Del</button>
        </div>
      </div>
    `).join("") : `<div class="empty-note">No countdowns yet.</div>`;
  }
  
  function renderShortcutSettings() {
    $("shortcutSettingsList").innerHTML = customShortcuts.length ? customShortcuts.map(s => {
      const { color, initial } = domainIconData(s.url);
      return `
        <div class="manage-item">
          <div class="manage-item-top">
            <div style="flex-shrink:0; width:44px; height:44px; border-radius:12px; background:${color}; color:#fff; display:grid; place-items:center; font-size:22px; font-weight:800;">${escapeHTML(initial)}</div>
            <div class="manage-item-details">
              <strong>${escapeHTML(s.name)}</strong>
              <small>${escapeHTML(getDomain(s.url))}</small>
            </div>
          </div>
          <div class="manage-item-actions">
            <button class="button" data-s-edit="${s.id}">Edit</button>
            <button class="button danger" data-s-del="${s.id}">Del</button>
          </div>
        </div>
      `;
    }).join("") : `<div class="empty-note">No custom shortcuts.</div>`;
  }

  function openManager() { $("homePage").classList.add("hidden"); $("managerPage").classList.add("active"); renderManage(); renderShortcutSettings(); window.scrollTo(0, 0);}
  function closeManager() { $("managerPage").classList.remove("active"); $("homePage").classList.remove("hidden"); renderHome(); window.scrollTo(0, 0);}

  /* Bottom Sheet Modals Logic */
  function openEventModal() { $("eventModal").classList.add("active"); }
  function closeEventModal() { $("eventModal").classList.remove("active"); resetEventForm(); }
  
  function openShortcutModal() { $("shortcutModal").classList.add("active"); }
  function closeShortcutModal() { $("shortcutModal").classList.remove("active"); resetShortcutForm(); }

  $("eventModal").onclick = e => { if(e.target === $("eventModal")) closeEventModal(); };
  $("shortcutModal").onclick = e => { if(e.target === $("shortcutModal")) closeShortcutModal(); };

  /* Event Form */
  function resetEventForm() { editingId = null; $("eventForm").reset(); $("eventDateInput").value = dateToday(); $("formTitle").textContent = "Add Event"; $("saveEvent").textContent = "Save"; $("formStatus").textContent = ""; }
  $("openAddEventBtn").onclick = () => { resetEventForm(); openEventModal(); $("eventNameInput").focus(); };
  
  $("eventForm").onsubmit = e => {
    e.preventDefault(); const n = $("eventNameInput").value.trim(), d = $("eventDateInput").value;
    if (!n || !validDate(d)) return;
    if (editingId) events = events.map(x => x.id === editingId ? { ...x, name: n, date: d } : x); else events.push({ id: createId(), name: n, date: d });
    if (saveEvents()) { closeEventModal(); renderManage(); renderHome(); }
  };
  
  $("manageList").onclick = e => {
    const editBtn = e.target.closest("[data-edit]");
    const delBtn = e.target.closest("[data-delete]");
    if (editBtn) {
      const it = events.find(x => x.id === editBtn.dataset.edit);
      if (it) { editingId = it.id; $("eventNameInput").value = it.name; $("eventDateInput").value = it.date; $("formTitle").textContent = "Edit Event"; $("saveEvent").textContent = "Update"; openEventModal(); }
    }
    if (delBtn && confirm("Delete event?")) { events = events.filter(x => x.id !== delBtn.dataset.delete); saveEvents(); renderManage(); renderHome(); }
  };
  $("cancelEdit").onclick = closeEventModal;

  /* Shortcut Form */
  function resetShortcutForm() { editingShortcutId = null; $("shortcutForm").reset(); $("shortcutFormTitle").textContent = "Add Shortcut"; $("saveShortcut").textContent = "Save"; $("shortcutStatus").textContent = ""; updateShortcutPreview(); }
  $("openAddShortcutBtn").onclick = () => { resetShortcutForm(); openShortcutModal(); $("shortcutNameInput").focus(); };

  $("shortcutForm").onsubmit = e => {
    e.preventDefault(); const raw = $("shortcutUrlInput").value.trim(), url = normalizeUrl(raw), name = $("shortcutNameInput").value.trim() || getDomain(url);
    if (!url) return;
    if (editingShortcutId) customShortcuts = customShortcuts.map(x => x.id === editingShortcutId ? { ...x, name, url } : x); else customShortcuts.push({ id: createId(), name, url });
    if (saveShortcuts()) { closeShortcutModal(); renderShortcutSettings(); renderShortcuts(); }
  };
  
  $("shortcutSettingsList").onclick = e => {
    const editBtn = e.target.closest("[data-s-edit]");
    const delBtn = e.target.closest("[data-s-del]");
    if (editBtn) {
      const it = customShortcuts.find(x => x.id === editBtn.dataset.sEdit);
      if (it) { editingShortcutId = it.id; $("shortcutNameInput").value = it.name; $("shortcutUrlInput").value = it.url; $("shortcutFormTitle").textContent = "Edit Shortcut"; $("saveShortcut").textContent = "Update"; updateShortcutPreview(); openShortcutModal(); }
    }
    if (delBtn && confirm("Delete shortcut?")) { customShortcuts = customShortcuts.filter(x => x.id !== delBtn.dataset.sDel); saveShortcuts(); renderShortcutSettings(); renderShortcuts(); }
  };
  $("cancelShortcutEdit").onclick = closeShortcutModal;

  /* Backup & UI Listeners */
  $("exportBtn").onclick = () => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ version: 4, events, shortcuts: customShortcuts, notes: notesText, tasks: tasksList })], { type: "application/json" }));
    a.download = "homepage-backup.json"; a.click();
  };
  $("importBtn").onclick = () => $("importFile").click();
  $("importFile").onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    try { 
      const p = JSON.parse(await f.text()); 
      events = normalizeEvents(p.events || p); customShortcuts = normalizeShortcuts(p.shortcuts || []); 
      notesText = p.notes || ""; tasksList = normalizeTasks(p.tasks || []);
      saveEvents(); saveShortcuts(); saveNotes(); saveTasks();
      $("notesArea").value = notesText;
      renderHome(); renderTasks(); renderManage(); renderShortcutSettings(); 
    } catch {} e.target.value = "";
  };

  $("openSettings").onclick = openManager; 
  $("backHome").onclick = closeManager;
  $("countdown").onclick = () => { if ($("countdown").classList.contains("empty-state")) openEventModal(); };

  function updateClock() {
    const now = new Date(), hr = now.getHours();
    $("greeting").textContent = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";
    // Once clock ticks after load, block initial render animations on subsequent DOM patches
    renderHome();
  }

  /* App Init */
  load(); 
  $("eventDateInput").value = dateToday(); 
  updateShortcutPreview(); 
  
  // Set UI States
  $("notesArea").value = notesText;
  if(notesText.trim().length > 0) $("notesWrapper").classList.add("has-text");
  
  // Wait a tick before sizing textarea to ensure DOM is ready
  setTimeout(() => { autoResizeTextarea($("notesArea")); }, 0);
  
  renderTasks();
  updateClock(); // Performs initial render (with animation classes via isInitialRender = true)
  renderManage(); 
  renderShortcutSettings(); 
  
  setInterval(() => {
    isInitialRender = false;
    updateClock();
  }, 60000);
  
  initFirebaseSync();
  
  // Flip initial render flag cleanly after first synchronous load 
  // so that subsequent background fetches from Firebase trigger a seamless mutation.
  setTimeout(() => { isInitialRender = false; }, 800);

</script>
</body>
</html>
