<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
<meta name="description" content="A personal homepage with countdowns and custom shortcuts.">
<meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
<title>Homepage</title>

<style>
/* 
  MODERN NATIVE APP UI DESIGN 
  Animations, touch-states, fluid layouts, and frosted modals
*/

:root {
  color-scheme: light;
  --bg: #f9f9f9;
  --panel: #ffffff;
  --text: #1a1a1a;
  --text-soft: #4a4a4a;
  --muted: #8e8e93;
  --line: #e5e5ea;
  --accent: #007aff;
  --hero-a: #ffffff;
  --hero-b: #f0f4fa;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
  --shadow-modal: 0 20px 40px rgba(0,0,0,0.12);
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #131313;
    --panel: #1c1c1e;
    --text: #f5f5f7;
    --text-soft: #a1a1a6;
    --muted: #636366;
    --line: #2c2c2e;
    --accent: #0a84ff;
    --hero-a: #1c1c1e;
    --hero-b: #161d27;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-modal: 0 20px 40px rgba(0,0,0,0.6);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Hide scrollbars for app-like feel */
::-webkit-scrollbar { display: none; }
html { scrollbar-width: none; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
}

input, select { -webkit-user-select: auto; user-select: auto; }
button, input, select { font: inherit; }
button { cursor: pointer; border: none; background: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
[hidden] { display: none !important; }

/* Active Touch States for Native Feel */
button:active, .shortcut:active, .event-tile:active, .countdown:active {
  transform: scale(0.97);
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Animations */
@keyframes slideUpFade {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-in {
  animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  opacity: 0;
}

/* Page Layout & Transitions */
.page-container {
  position: relative;
  width: 100%;
  max-width: 800px;
  margin: auto;
  min-height: 100vh;
}

.home-page {
  padding: 24px 20px 40px;
  transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  transform-origin: top center;
}
.home-page.hidden {
  opacity: 0;
  transform: scale(0.94);
  pointer-events: none;
  position: absolute;
  width: 100%;
}

.manager-page {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: var(--bg);
  z-index: 100;
  overflow-y: auto;
  padding: 24px 20px 60px;
  opacity: 0;
  transform: translateY(30px);
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.manager-page.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.manager-inner { max-width: 800px; margin: auto; }

/* Header / Welcome */
.welcome { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.greeting { font-size: clamp(24px, 5vw, 32px); font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
.header-right { display: flex; align-items: center; gap: 12px; }
.date-label-text { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.edit-link { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow-sm); color: var(--text-soft); transition: all 0.2s; border: 1px solid var(--line); }
.edit-link:hover { color: var(--accent); transform: scale(1.05); }
.edit-link svg { width: 18px; height: 18px; }

/* Hero Countdown (Compact Two-Column) */
.countdown {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 20px 24px; border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(255,255,255,0.05);
  transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  margin-bottom: 16px; /* tight spacing to the grid below */
}
.countdown.urgent { background: linear-gradient(135deg, #fff7ed, #ffedd5); border-color: #fdba74; }
.countdown.last-day { background: linear-gradient(135deg, #fef2f2, #fee2e2); border-color: #fca5a5; }
@media (prefers-color-scheme: dark) {
  .countdown.urgent { background: linear-gradient(135deg, #2a1608, #3a1c06); border-color: #9a3412; }
  .countdown.last-day { background: linear-gradient(135deg, #2a0808, #3a0606); border-color: #991b1b; }
}

.countdown-left { flex: 1; min-width: 0; }
.event-name { margin: 0 0 2px; font-size: clamp(22px, 4.5vw, 28px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; overflow-wrap: anywhere; }
.event-meta { color: var(--text-soft); font-size: 13px; font-weight: 600; }
.countdown-right { display: flex; align-items: baseline; gap: 8px; flex-shrink: 0; text-align: right; }
.days-number { font-size: clamp(38px, 8vw, 52px); font-weight: 800; letter-spacing: -0.04em; color: var(--accent); line-height: 1; }
.days-label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

/* Upcoming Events (Bottom Aligned Text) */
.event-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.event-tile {
  display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  padding: 16px; border-radius: var(--radius-md);
  background: var(--panel); box-shadow: var(--shadow-sm);
  transition: transform 0.2s; border: 1px solid var(--line);
}
.event-tile-name { font-size: 16px; font-weight: 700; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.event-tile-bottom { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; gap: 8px; }
.event-tile-date { font-size: 12px; font-weight: 600; color: var(--text-soft); padding-bottom: 3px; white-space: nowrap; }
.event-tile-count { display: flex; align-items: baseline; gap: 4px; text-align: right; }
.event-tile-count strong { font-size: 22px; font-weight: 800; line-height: 1; }
.event-tile-count small { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }

/* Color classes for numbers */
.orange { color: #f59e0b; } .red { color: #ef4444; } .blue { color: #3b82f6; } .green { color: #10b981; }

.empty-note { padding: 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }

/* Sections */
.section { margin-top: 32px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }

/* Shortcuts (Uniform Squircle Icons) */
.shortcuts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 16px 8px;
}
.shortcut { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; transition: transform 0.2s; }
.shortcut-icon {
  width: 60px; height: 60px; display: grid; place-items: center;
  border-radius: 18px; background: var(--panel); box-shadow: var(--shadow-sm);
  font-size: 24px; color: var(--text); border: 1px solid var(--line);
}
.shortcut-icon svg { width: 28px; height: 28px; }
.shortcut-label { font-size: 11px; font-weight: 600; color: var(--text-soft); width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shortcut-add .shortcut-icon svg { color: var(--muted); }

/* MODALS (Frosted Glass, No Dim) */
.modal-backdrop {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
@media (prefers-color-scheme: dark) {
  .modal-backdrop { background: rgba(0, 0, 0, 0.05); }
}
.modal-backdrop.active { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 24px;
  width: calc(100% - 40px); max-width: 400px;
  box-shadow: var(--shadow-modal);
  transform: scale(0.95) translateY(10px);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.modal-backdrop.active .modal-box { transform: scale(1) translateY(0); }

/* Forms Inside Modals */
.modal-box .panel-title { font-size: 20px; font-weight: 800; margin: 0 0 20px; color: var(--text); letter-spacing: -0.02em; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font-size: 12px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.05em; }
.field input { 
  width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); 
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
  font-size: 15px; font-weight: 500; transition: border 0.2s;
}
.form-actions { display: flex; gap: 12px; margin-top: 24px; }
.button { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 14px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; background: var(--bg); border: 1px solid var(--line); color: var(--text); transition: transform 0.1s, opacity 0.2s; }
.button:active { transform: scale(0.96); }
.button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(0,122,255,0.3); }
.button.danger { color: #ff3b30; background: rgba(255,59,48,0.1); border-color: transparent; }
.status { min-height: 20px; margin: 12px 0 0; color: var(--muted); font-size: 13px; text-align: center;}

.shortcut-preview { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg); border: 1px dashed var(--line); border-radius: var(--radius-sm); }
.shortcut-preview .shortcut-icon { flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; box-shadow: none; }
.shortcut-preview .shortcut-icon svg { width: 22px; height: 22px; }
.shortcut-preview-text { min-width: 0; }
.shortcut-preview-text strong { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shortcut-preview-text small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

/* Manager / Settings Page Lists */
.manager-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.back-button { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow-sm); color: var(--text); transition: transform 0.2s; border: 1px solid var(--line); }
.back-button svg { width: 20px; height: 20px; margin-right: 2px; }
.manager-title { font-size: 24px; font-weight: 800; margin: 0; }
.manager-subtitle { font-size: 13px; color: var(--text-soft); margin-top: 2px; }

.manager-content { display: grid; grid-template-columns: 1fr; gap: 40px; }
@media(min-width: 768px) { .manager-content { grid-template-columns: 1fr 1fr; } }

.list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.list-header .panel-title { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.add-btn-small { padding: 6px 14px; border-radius: 20px; min-height: 0; font-size: 13px; }

.manage-list { display: flex; flex-direction: column; gap: 12px; }
.manage-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: var(--radius-md); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.manage-item-details strong { display: block; font-size: 15px; font-weight: 700; margin-bottom: 4px; overflow-wrap: anywhere; }
.manage-item-details small { font-size: 13px; color: var(--text-soft); font-weight: 500; }
.manage-item-actions { display: flex; gap: 8px; flex-shrink: 0; }
.manage-item-actions button { padding: 8px 12px; font-size: 13px; border-radius: 8px; min-height: 0; }

/* Responsive adjustments */
@media (max-width: 500px) {
  .event-cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .shortcuts { grid-template-columns: repeat(4, 1fr); }
  .manage-item { flex-direction: column; align-items: flex-start; gap: 12px; }
  .manage-item-actions { width: 100%; }
  .manage-item-actions button { flex: 1; }
}
</style>
</head>

<body>

<div class="page-container">
  
  <!-- HOME PAGE -->
  <main class="home-page" id="homePage">
    <section class="welcome animate-in" style="animation-delay: 0s">
      <div id="greeting" class="greeting">Hello</div>
      <div class="header-right">
        <div id="dateLabel" class="date-label-text"></div>
        <button class="edit-link" id="openSettings" type="button" aria-label="Settings">
          <!-- Gear Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </section>

    <!-- Hero Countdown (Two Column) -->
    <section id="countdown" class="countdown animate-in" style="animation-delay: 0.1s" aria-live="polite">
      <div class="countdown-left">
        <div id="eventName" class="event-name">Loading...</div>
        <div id="eventMeta" class="event-meta">...</div>
      </div>
      <div class="countdown-right">
        <div id="daysNumber" class="days-number">—</div>
        <div id="daysLabel" class="days-label">DAYS LEFT</div>
      </div>
    </section>

    <!-- Event Cards Grid (No Header) -->
    <section id="allEventsSection" hidden>
      <div id="eventCards" class="event-cards"></div>
    </section>

    <!-- Shortcuts -->
    <section class="section">
      <div class="section-head animate-in" style="animation-delay: 0.3s">
        <h2>Shortcuts</h2>
      </div>
      <nav class="shortcuts" id="shortcutGrid" aria-label="Quick access shortcuts"></nav>
    </section>
  </main>

  <!-- FULL-SCREEN SETTINGS PAGE -->
  <main class="manager-page" id="managerPage">
    <div class="manager-inner">
      <header class="manager-header">
        <button class="back-button" id="backHome" type="button" aria-label="Back to homepage">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path><path d="M9 12h12"></path></svg>
        </button>
        <div>
          <h1 class="manager-title">Settings</h1>
          <p class="manager-subtitle">Manage countdowns & shortcuts</p>
        </div>
      </header>

      <div class="manager-content">
        <!-- EVENTS LIST -->
        <section>
          <div class="list-header">
            <h2 class="panel-title">Your Events</h2>
            <button class="button primary add-btn-small" id="openAddEventBtn">+ Add</button>
          </div>
          <div class="manage-list" id="manageList"></div>
        </section>

        <!-- SHORTCUTS & BACKUP -->
        <section>
          <div class="list-header">
            <h2 class="panel-title">Your Shortcuts</h2>
            <button class="button primary add-btn-small" id="openAddShortcutBtn">+ Add</button>
          </div>
          <div class="manage-list" id="shortcutSettingsList" style="margin-bottom:40px;"></div>

          <h2 class="panel-title" style="margin:0 0 16px;">Data Backup</h2>
          <div style="display:flex; gap:12px;">
            <button class="button" id="exportBtn" type="button">Export</button>
            <button class="button" id="importBtn" type="button">Import</button>
            <input id="importFile" type="file" accept=".json,application/json" hidden>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- EVENT MODAL -->
  <div id="eventModal" class="modal-backdrop">
    <div class="modal-box">
      <h2 class="panel-title" id="formTitle">Add Event</h2>
      <form id="eventForm" novalidate>
        <div class="field">
          <label for="eventNameInput">Event Name</label>
          <input id="eventNameInput" maxlength="100" required placeholder="e.g. SSC Exam" autocomplete="off">
        </div>
        <div class="field">
          <label for="eventDateInput">Date</label>
          <input id="eventDateInput" type="date" required>
        </div>
        <div class="form-actions">
          <button class="button primary" id="saveEvent" type="submit">Save</button>
          <button class="button" id="cancelEdit" type="button">Cancel</button>
        </div>
        <p class="status" id="formStatus" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- SHORTCUT MODAL -->
  <div id="shortcutModal" class="modal-backdrop">
    <div class="modal-box">
      <h2 class="panel-title" id="shortcutFormTitle">Add Shortcut</h2>
      <form id="shortcutForm" novalidate>
        <div class="field">
          <label for="shortcutNameInput">Name (Optional)</label>
          <input id="shortcutNameInput" maxlength="50" placeholder="e.g. My Website" autocomplete="off">
        </div>
        <div class="field">
          <label for="shortcutUrlInput">Website URL</label>
          <input id="shortcutUrlInput" type="url" placeholder="https://example.com" required autocomplete="url">
        </div>
        
        <div class="shortcut-preview">
          <div id="shortcutPreviewIcon" class="shortcut-icon" aria-hidden="true"></div>
          <div class="shortcut-preview-text">
            <strong id="shortcutPreviewName">Website preview</strong>
            <small id="shortcutPreviewDomain">example.com</small>
          </div>
        </div>

        <div class="form-actions">
          <button class="button primary" id="saveShortcut" type="submit">Save</button>
          <button class="button" id="cancelShortcutEdit" type="button">Cancel</button>
        </div>
        <p class="status" id="shortcutStatus" aria-live="polite"></p>
      </form>
    </div>
  </div>

</div>

<!-- Firebase & Application Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCOOZT69onGu6rJcqHe0e6ryI4rz5gK-uM",
    authDomain: "hisapbook.firebaseapp.com",
    databaseURL: "https://hisapbook-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "hisapbook",
    storageBucket: "hisapbook.firebasestorage.app",
    messagingSenderId: "918573857911",
    appId: "1:918573857911:web:5d88f96da79ab77d98da72"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const EVENTS_KEY = "countdownHome.events.v3"; // Version bumped for simple layout
  const OLD_EVENTS_KEY = "countdownHome.events.v2";
  const SHORTCUTS_KEY = "countdownHome.shortcuts.v1";
  const FIREBASE_PATH = "homepageData";

  const $ = id => document.getElementById(id);

  let events = [];
  let customShortcuts = [];
  
  let lastUpdateTimestamp = 0; 
  let editingId = null;
  let editingShortcutId = null;

  /* Utilities */
  function escapeHTML(value) { return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]); }
  function createId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`; }
  function dateToday() { const d = new Date(); return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-"); }
  function validDate(value) {
    if (typeof value !== "string") return false;
    const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) return false;
    const year = Number(match[1]), month = Number(match[2]), day = Number(match[3]);
    const date = new Date(year, month - 1, day);
    return (date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day);
  }
  function dayDiff(value) {
    const [year, month, day] = value.split("-").map(Number);
    const [todayYear, todayMonth, todayDay] = dateToday().split("-").map(Number);
    return Math.round((Date.UTC(year, month - 1, day) - Date.UTC(todayYear, todayMonth - 1, todayDay)) / 86400000);
  }
  function formatDate(value) {
    const [year, month, day] = value.split("-").map(Number);
    return new Date(year, month - 1, day, 12).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  /* Icons */
  function svgIcon(name, color = "currentColor") {
    const icons = {
      google: `<svg viewBox="0 0 48 48"><path fill="#4285F4" d="M43.6 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.9 6-15.5Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4.1 2-6.8 2-5.2 0-9.7-3.5-11.3-8.2H5.8v5.3C9.2 39.6 16 44 24 44Z"/><path fill="#FBBC05" d="M12.7 27.8a12 12 0 0 1 0-7.6v-5.3H5.8a20 20 0 0 0 0 18.2l6.9-5.3Z"/><path fill="#EA4335" d="M24 12.2c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 6 29.5 4 24 4 16 4 9.2 8.4 5.8 14.9l6.9 5.3c1.6-4.7 6.1-8 11.3-8Z"/></svg>`,
      youtube: `<svg viewBox="0 0 48 48"><rect x="3" y="9" width="42" height="30" rx="8" fill="#FF0033"/><path d="M20 17v14l12-7-12-7Z" fill="#fff"/></svg>`,
      gmail: `<svg viewBox="0 0 48 48"><path fill="#4285F4" d="M6 38V13l6-4 6 4v25H6Z"/><path fill="#34A853" d="M18 38V13l6 5 6-5v25H18Z"/><path fill="#EA4335" d="M6 13 24 27 42 13V8L24 22 6 8v5Z"/><path fill="#FBBC05" d="M30 38V13l6-4 6 4v25H30Z"/><path fill="#C5221F" d="M30 13 42 8v5L30 22V13Z"/></svg>`,
      amazon: `<svg viewBox="0 0 48 48"><path fill="#232F3E" d="M8 7h32v27H8z"/><path fill="#fff" d="M13 13h22v3H13zm0 6h22v3H13zm0 6h14v3H13z"/><path fill="#FF9900" d="M10 36c9 7 20 7 29 0l-2-3c-8 5-17 5-25 0l-2 3Z"/><path fill="#FF9900" d="m34 32 7 2-4 6-3-8Z"/></svg>`,
      flipkart: `<svg viewBox="0 0 48 48"><path fill="#2874F0" d="M12 5h24v38H12z"/><path fill="#FFE500" d="M17 12h14v5H17zm-2 8h18v15H15z"/><path fill="#2874F0" d="M20 23h8v7h-8z"/></svg>`,
      assamcareer: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#146C43"/><path fill="#fff" d="M24 7 39 15v18L24 41 9 33V15L24 7Z"/><path fill="#146C43" d="M24 12 34 18v12l-10 6-10-6V18l10-6Z"/><path fill="#F4D35E" d="M18 20h12v3H18zm0 5h12v3H18z"/></svg>`,
      plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`
    };
    return icons[name] || `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="${color}"/><text x="24" y="32" font-size="24" font-weight="800" text-anchor="middle" fill="#fff">W</text></svg>`;
  }

  const iconColors = ["#E85D75", "#8E44AD", "#3498DB", "#16A085", "#E67E22", "#2C3E50", "#D35400", "#2980B9", "#C0392B", "#27AE60", "#6C5CE7", "#F39C12", "#00A8A8"];
  function getDomain(url) { try { return new URL(url).hostname.replace(/^www\./, "").toLowerCase(); } catch { return ""; } }
  function domainIcon(url) {
    const domain = getDomain(url);
    let hash = 0; for (let i = 0; i < domain.length; i++) hash = ((hash << 5) - hash) + domain.charCodeAt(i);
    const color = iconColors[Math.abs(hash) % iconColors.length];
    const parts = domain.split(".");
    const initial = (parts.length > 1 ? parts[parts.length - 2] : parts[0]).charAt(0).toUpperCase() || "W";
    return { color, html: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="${color}"/><text x="24" y="32" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#ffffff">${escapeHTML(initial)}</text></svg>` };
  }

  const defaultShortcuts = [
    { id: "default-google", name: "Google", url: "https://www.google.com/", icon: "google", color: "#4285F4" },
    { id: "default-youtube", name: "YouTube", url: "https://www.youtube.com/", icon: "youtube", color: "#FF0033" },
    { id: "default-assamcareer", name: "AssamCareer", url: "https://assamcareer.com/", icon: "assamcareer", color: "#146C43" },
    { id: "default-gmail", name: "Gmail", url: "https://mail.google.com/", icon: "gmail", color: "#EA4335" },
    { id: "default-amazon", name: "Amazon", url: "https://www.amazon.in/", icon: "amazon", color: "#FF9900" },
    { id: "default-flipkart", name: "Flipkart", url: "https://www.flipkart.com/", icon: "flipkart", color: "#2874F0" }
  ];

  /* Data Normalization */
  function normalizeUrl(urlStr) {
    let url = String(urlStr || "").trim(); if (!url) return "";
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    try { const p = new URL(url); return (p.protocol === "http:" || p.protocol === "https:") && p.hostname.includes(".") ? p.href : ""; } catch { return ""; }
  }
  function normalizeEvents(arr) {
    return Array.isArray(arr) ? arr.map(e => ({ id: String(e.id || createId()), name: String(e.name).trim().slice(0, 100), date: e.date })).filter(e => e.name && validDate(e.date)) : [];
  }
  function normalizeShortcuts(arr) {
    return Array.isArray(arr) ? arr.map(s => { const url = normalizeUrl(s.url); return { id: String(s.id || createId()), name: String(s.name || getDomain(url)).trim().slice(0, 50), url }; }).filter(s => s.url) : [];
  }

  /* Cache & Sync Logic */
  function load() {
    try { let r = localStorage.getItem(EVENTS_KEY); if (!r) r = localStorage.getItem(OLD_EVENTS_KEY); events = r ? normalizeEvents(JSON.parse(r)) : []; } catch { events = []; }
    try { const r = localStorage.getItem(SHORTCUTS_KEY); customShortcuts = r ? normalizeShortcuts(JSON.parse(r)) : []; } catch { customShortcuts = []; }
    lastUpdateTimestamp = parseInt(localStorage.getItem('syncTimestamp') || '0', 10);
  }
  function pushToFirebase() {
    lastUpdateTimestamp = Date.now(); localStorage.setItem('syncTimestamp', lastUpdateTimestamp.toString());
    set(ref(db, FIREBASE_PATH), { events, shortcuts: customShortcuts, updatedAt: lastUpdateTimestamp }).catch(console.error);
  }
  function saveEvents() { try { localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); pushToFirebase(); return true; } catch { return false; } }
  function saveShortcuts() { try { localStorage.setItem(SHORTCUTS_KEY, JSON.stringify(customShortcuts)); pushToFirebase(); return true; } catch { return false; } }

  // Sync happens completely silently in background
  function initFirebaseSync() {
    onValue(ref(db, FIREBASE_PATH), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const remoteTimestamp = data.updatedAt || 0;
        if (remoteTimestamp > lastUpdateTimestamp || lastUpdateTimestamp === 0) {
          events = normalizeEvents(data.events || []); customShortcuts = normalizeShortcuts(data.shortcuts || []);
          lastUpdateTimestamp = remoteTimestamp;
          localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); localStorage.setItem(SHORTCUTS_KEY, JSON.stringify(customShortcuts)); localStorage.setItem('syncTimestamp', lastUpdateTimestamp.toString());
          renderHome(); if ($("managerPage").classList.contains("active")) { renderManage(); renderShortcutSettings(); }
        } else if (lastUpdateTimestamp > remoteTimestamp) { pushToFirebase(); }
      } else if (events.length > 0 || customShortcuts.length > 0) { pushToFirebase(); }
    });
  }

  /* Shortcut Preview Rendering */
  function updateShortcutPreview() {
    const rawUrl = $("shortcutUrlInput").value.trim();
    const url = normalizeUrl(rawUrl);
    const customName = $("shortcutNameInput").value.trim();
    if (!url) {
      $("shortcutPreviewIcon").innerHTML = domainIcon("https://example.com").html;
      $("shortcutPreviewName").textContent = customName || "Website preview";
      $("shortcutPreviewDomain").textContent = "Enter a valid website URL";
      return;
    }
    const domain = getDomain(url);
    const icon = domainIcon(url);
    $("shortcutPreviewIcon").innerHTML = icon.html;
    $("shortcutPreviewName").textContent = customName || domain;
    $("shortcutPreviewDomain").textContent = domain;
  }
  $("shortcutUrlInput").addEventListener("input", updateShortcutPreview);
  $("shortcutNameInput").addEventListener("input", updateShortcutPreview);

  /* UI Rendering */
  function renderShortcuts() {
    const arr = [...defaultShortcuts, ...customShortcuts.map(s => ({ ...s, icon: "domain" }))];
    $("shortcutGrid").innerHTML = arr.map((s, i) => `
      <a class="shortcut animate-in" style="animation-delay: ${0.3 + (i * 0.03)}s" href="${escapeHTML(s.url)}" target="_blank" rel="noopener">
        <span class="shortcut-icon">${s.icon === "domain" ? domainIcon(s.url).html : svgIcon(s.icon, s.color)}</span>
        <span class="shortcut-label">${escapeHTML(s.name)}</span>
      </a>
    `).join("") + `
      <button class="shortcut shortcut-add animate-in" style="animation-delay: ${0.3 + (arr.length * 0.03)}s" id="addShortcutTile" type="button">
        <span class="shortcut-icon">${svgIcon("plus")}</span><span class="shortcut-label">Add</span>
      </button>`;
    
    $("addShortcutTile").addEventListener("click", () => { 
      openShortcutModal(); $("shortcutNameInput").focus(); 
    });
  }

  function renderHome() {
    const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
    const upcoming = sorted.filter(e => dayDiff(e.date) >= 0);
    const hero = $("countdown");
    hero.classList.remove("urgent", "last-day", "empty-state");

    if (upcoming[0]) {
      const n = dayDiff(upcoming[0].date);
      $("eventName").textContent = upcoming[0].name; $("eventMeta").textContent = `${formatDate(upcoming[0].date)}`;
      $("daysNumber").textContent = n === 0 ? "Today" : n; $("daysLabel").textContent = n === 0 ? "EVENT DAY" : n === 1 ? "DAY LEFT" : "DAYS LEFT";
      $("daysNumber").style.color = n === 0 ? "#ef4444" : n <= 1 ? "#f59e0b" : n <= 7 ? "#ef4444" : n <= 30 ? "#3b82f6" : "#10b981";
      if (n <= 1) { hero.classList.add("urgent"); if (n === 0) hero.classList.add("last-day"); }
      hero.removeAttribute("tabindex"); hero.removeAttribute("role");
    } else {
      $("eventName").textContent = events.length ? "No upcoming events" : "Add a countdown";
      $("eventMeta").textContent = events.length ? "All dates passed." : "Tap here to begin.";
      $("daysNumber").textContent = "—"; $("daysLabel").textContent = "DAYS LEFT"; $("daysNumber").style.color = "var(--accent)";
      hero.classList.add("empty-state"); hero.setAttribute("role", "button"); hero.setAttribute("tabindex", "0");
    }

    const rest = upcoming.slice(1);
    $("allEventsSection").hidden = !rest.length;
    $("eventCards").innerHTML = rest.map((e, i) => {
      const n = dayDiff(e.date);
      const color = n <= 1 ? "orange" : n <= 7 ? "red" : n <= 30 ? "blue" : "green";
      return `
        <article class="event-tile animate-in" style="animation-delay: ${0.2 + (i * 0.05)}s">
          <div class="event-tile-name">${escapeHTML(e.name)}</div>
          <div class="event-tile-bottom">
            <div class="event-tile-date">${escapeHTML(formatDate(e.date))}</div>
            <div class="event-tile-count">
              <strong class="${color}">${n === 0 ? "Today" : n}</strong>
              <small>${n === 0 ? "TODAY" : n === 1 ? "DAY LEFT" : "DAYS LEFT"}</small>
            </div>
          </div>
        </article>
      `;
    }).join("");
    renderShortcuts();
  }

  /* Manager Logic */
  function renderManage() {
    $("manageList").innerHTML = events.length ? [...events].sort((a,b)=>a.date.localeCompare(b.date)).map(e => `
      <div class="manage-item">
        <div class="manage-item-details">
          <strong>${escapeHTML(e.name)}</strong>
          <small>${escapeHTML(formatDate(e.date))}${dayDiff(e.date) < 0 ? " (Past)" : ""}</small>
        </div>
        <div class="manage-item-actions">
          <button class="button" data-edit="${e.id}">Edit</button>
          <button class="button danger" data-delete="${e.id}">Del</button>
        </div>
      </div>
    `).join("") : `<div class="empty-note">No countdowns yet.</div>`;
  }
  function renderShortcutSettings() {
    $("shortcutSettingsList").innerHTML = customShortcuts.length ? customShortcuts.map(s => `
      <div class="manage-item">
        <div style="display:flex; gap:12px; align-items:center; overflow:hidden;">
          <div style="flex-shrink:0; width:36px;height:36px;">${domainIcon(s.url).html}</div>
          <div class="manage-item-details" style="min-width:0;">
            <strong style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHTML(s.name)}</strong>
            <small style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">${escapeHTML(getDomain(s.url))}</small>
          </div>
        </div>
        <div class="manage-item-actions">
          <button class="button" data-s-edit="${s.id}">Edit</button>
          <button class="button danger" data-s-del="${s.id}">Del</button>
        </div>
      </div>
    `).join("") : `<div class="empty-note">No custom shortcuts.</div>`;
  }

  function openManager() { $("homePage").classList.add("hidden"); $("managerPage").classList.add("active"); renderManage(); renderShortcutSettings(); }
  function closeManager() { $("managerPage").classList.remove("active"); $("homePage").classList.remove("hidden"); renderHome(); }

  /* Modals Display Logic */
  function openEventModal() { $("eventModal").classList.add("active"); }
  function closeEventModal() { $("eventModal").classList.remove("active"); resetEventForm(); }
  
  function openShortcutModal() { $("shortcutModal").classList.add("active"); }
  function closeShortcutModal() { $("shortcutModal").classList.remove("active"); resetShortcutForm(); }

  /* Event Form */
  function resetEventForm() { editingId = null; $("eventForm").reset(); $("eventDateInput").value = dateToday(); $("formTitle").textContent = "Add Event"; $("saveEvent").textContent = "Save"; $("formStatus").textContent = ""; }
  $("openAddEventBtn").onclick = () => { resetEventForm(); openEventModal(); $("eventNameInput").focus(); };
  
  $("eventForm").onsubmit = e => {
    e.preventDefault(); const n = $("eventNameInput").value.trim(), d = $("eventDateInput").value;
    if (!n || !validDate(d)) return;
    if (editingId) events = events.map(x => x.id === editingId ? { ...x, name: n, date: d } : x); else events.push({ id: createId(), name: n, date: d });
    if (saveEvents()) { closeEventModal(); renderManage(); renderHome(); }
  };
  
  $("manageList").onclick = e => {
    const editBtn = e.target.closest("[data-edit]");
    const delBtn = e.target.closest("[data-delete]");
    if (editBtn) {
      const it = events.find(x => x.id === editBtn.dataset.edit);
      if (it) { editingId = it.id; $("eventNameInput").value = it.name; $("eventDateInput").value = it.date; $("formTitle").textContent = "Edit Event"; $("saveEvent").textContent = "Update"; openEventModal(); }
    }
    if (delBtn && confirm("Delete event?")) { events = events.filter(x => x.id !== delBtn.dataset.delete); saveEvents(); renderManage(); renderHome(); }
  };
  $("cancelEdit").onclick = closeEventModal;

  /* Shortcut Form */
  function resetShortcutForm() { editingShortcutId = null; $("shortcutForm").reset(); $("shortcutFormTitle").textContent = "Add Shortcut"; $("saveShortcut").textContent = "Save"; $("shortcutStatus").textContent = ""; updateShortcutPreview(); }
  $("openAddShortcutBtn").onclick = () => { resetShortcutForm(); openShortcutModal(); $("shortcutNameInput").focus(); };

  $("shortcutForm").onsubmit = e => {
    e.preventDefault(); const raw = $("shortcutUrlInput").value.trim(), url = normalizeUrl(raw), name = $("shortcutNameInput").value.trim() || getDomain(url);
    if (!url) return;
    if (editingShortcutId) customShortcuts = customShortcuts.map(x => x.id === editingShortcutId ? { ...x, name, url } : x); else customShortcuts.push({ id: createId(), name, url });
    if (saveShortcuts()) { closeShortcutModal(); renderShortcutSettings(); renderShortcuts(); }
  };
  
  $("shortcutSettingsList").onclick = e => {
    const editBtn = e.target.closest("[data-s-edit]");
    const delBtn = e.target.closest("[data-s-del]");
    if (editBtn) {
      const it = customShortcuts.find(x => x.id === editBtn.dataset.sEdit);
      if (it) { editingShortcutId = it.id; $("shortcutNameInput").value = it.name; $("shortcutUrlInput").value = it.url; $("shortcutFormTitle").textContent = "Edit Shortcut"; $("saveShortcut").textContent = "Update"; updateShortcutPreview(); openShortcutModal(); }
    }
    if (delBtn && confirm("Delete shortcut?")) { customShortcuts = customShortcuts.filter(x => x.id !== delBtn.dataset.sDel); saveShortcuts(); renderShortcutSettings(); renderShortcuts(); }
  };
  $("cancelShortcutEdit").onclick = closeShortcutModal;

  /* Backup & UI Listeners */
  $("exportBtn").onclick = () => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ version: 3, events, shortcuts: customShortcuts })], { type: "application/json" }));
    a.download = "homepage-backup.json"; a.click();
  };
  $("importBtn").onclick = () => $("importFile").click();
  $("importFile").onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    try { const p = JSON.parse(await f.text()); events = normalizeEvents(p.events || p); customShortcuts = normalizeShortcuts(p.shortcuts || []); saveEvents(); saveShortcuts(); renderHome(); renderManage(); renderShortcutSettings(); } catch {} e.target.value = "";
  };

  $("openSettings").onclick = openManager; 
  $("backHome").onclick = closeManager;
  $("countdown").onclick = () => { if ($("countdown").classList.contains("empty-state")) openEventModal(); };

  function updateClock() {
    const now = new Date(), hr = now.getHours();
    $("greeting").textContent = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";
    $("dateLabel").textContent = now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
    renderHome();
  }

  /* App Init */
  load(); $("eventDateInput").value = dateToday(); updateShortcutPreview(); updateClock(); renderManage(); renderShortcutSettings(); renderShortcuts();
  setInterval(updateClock, 60000);
  initFirebaseSync();
</script>
</body>
</html>
